x-dashboard-env: &dashboard-env
  APP_NAME: Toxbot
  APP_ENV: production
  APP_DEBUG: "false"
  APP_LOCALE: ${APP_LOCALE:-en}
  APP_KEY: ${APP_KEY}
  APP_URL: ${APP_URL}
  DB_CONNECTION: mysql
  DB_HOST: ${DB_HOST:-host.docker.internal}
  DB_PORT: ${DB_PORT:-3306}
  DB_DATABASE: ${DB_DATABASE:-toxbot}
  DB_USERNAME: ${DB_USERNAME}
  DB_PASSWORD: ${DB_PASSWORD}
  SESSION_DRIVER: database
  SESSION_ENCRYPT: "true"
  SESSION_SECURE_COOKIE: "true"
  CACHE_STORE: database
  QUEUE_CONNECTION: sync
  DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
  DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}
  DISCORD_REDIRECT_URI: ${APP_URL}/auth/discord/callback
  DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
  TOXBOT_OWNER_ID: ${OWNER_ID}
  TOXBOT_PREMIUM_USERS: ${PREMIUM_USERS:-}
  TOXBOT_PREMIUM_USER_SKUS: ${PREMIUM_USER_SKUS:-}
  TOXBOT_PREMIUM_GUILDS: ${PREMIUM_GUILDS:-}
  TOXBOT_PREMIUM_GUILD_SKUS: ${PREMIUM_GUILD_SKUS:-}
  TOXBOT_CURRENCY: ${CURRENCY:-Credits}
  TOPGG_WEBHOOK_SECRET: ${TOPGG_WEBHOOK_SECRET:-}
  TOPGG_VOTE_REWARD: ${TOPGG_VOTE_REWARD:-200}
  STREAM_WEBHOOK_SECRET: ${STREAM_WEBHOOK_SECRET:-}
  TWITCH_CLIENT_ID: ${TWITCH_CLIENT_ID:-}
  TWITCH_CLIENT_SECRET: ${TWITCH_CLIENT_SECRET:-}
  YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}

services:
  bot:
    image: ghcr.io/newtox/toxbot:latest
    container_name: toxbot
    restart: unless-stopped
    environment:
      token: ${DISCORD_BOT_TOKEN}
      db_host: ${DB_HOST:-host.docker.internal}
      db_user: ${DB_USERNAME}
      db_password: ${DB_PASSWORD}
      db_name: ${DB_DATABASE:-toxbot}
      owner_id: ${OWNER_ID}
      dashboard_url: http://toxbot-dashboard:8080
      premium_users: ${PREMIUM_USERS:-}
      premium_user_skus: ${PREMIUM_USER_SKUS:-}
      xp_boost_sku: ${XP_BOOST_SKU:-}
      currency: ${CURRENCY:-Credits}
      tag_report_channel: ${TAG_REPORT_CHANNEL:-}
      log_channel: ${LOG_CHANNEL:-}
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - /docker_volumes/rustdesk/hbbs:/data/rustdesk:ro

  dashboard:
    image: ghcr.io/newtox/toxbot-dashboard:latest
    container_name: toxbot-dashboard
    restart: unless-stopped
    ports:
      - 127.0.0.1:8090:8080
    environment: *dashboard-env
    volumes:
      - /docker_volumes/toxbot-dashboard/backgrounds:/var/www/html/storage/app/private/backgrounds
    extra_hosts:
      - host.docker.internal:host-gateway

  scheduler:
    image: ghcr.io/newtox/toxbot-dashboard:latest
    container_name: toxbot-scheduler
    restart: unless-stopped
    command: ["php", "/var/www/html/artisan", "schedule:work"]
    stop_signal: SIGTERM
    environment:
      <<: *dashboard-env
      AUTORUN_ENABLED: "false"
    healthcheck:
      test: ["CMD", "healthcheck-schedule"]
      start_period: 10s
    extra_hosts:
      - host.docker.internal:host-gateway
